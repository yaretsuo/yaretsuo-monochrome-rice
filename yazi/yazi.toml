[manager]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
linemode = "size"
layout = [ 1, 3, 4 ]

[opener]
edit = [
    { run = 'vim "$@"', block = true, for = "unix" }
]

extract = [
    { run = '7z x "$1"', block = true, desc = "Extract with 7z", for = "unix" },
]

display = [
    { run = 'swayimg "$@"', orphan = true, desc = "Open" }
]

video = [
    { run = 'mpv "$@"', block = false, desc = "Play with mpv"}
]

browser = [
    { run = 'xdg-open "$@"', desc = "Open in Browser", detach = true }
]

[open]
rules = [
    { mime = "image/*", use = ["display"] },
    { mime = "image/webp", use = ["display"] },
    { mime = "video/*", use = ["video"] },
    { mime = "audio/*", use = ["video"] },
    { mime = "text/*",  use = ["edit"] },
    { mime = "application/pdf", use = ["browser", "reveal"] },   
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract"] },

    { name = "*.pdf", use = ["browser", "reveal"] }, 
    { name = "*.mkv",  use = "video" },
    { name = "*.mp4",  use = "video" },
    { name = "*.avi",  use = "video" },
    { name = "*.mov",  use = "video" },
    { name = "*.webm", use = "video" },
    { name = "*",      use = "edit" }
]
